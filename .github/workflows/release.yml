name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Test
        run: |
          go mod download
          go test -v ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*

  build-image:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: ./artifacts

      - name: Prepare image build context
        run: |
          set -eux
          mkdir -p image_ctx
          # Find the linux tarball produced by goreleaser
          TAR=$(ls artifacts | grep -E "dayzctl_.*_linux_.*\.tar\.gz" | head -n1 || true)
          if [ -z "$TAR" ]; then
            echo "No linux release tarball found in artifacts" >&2
            exit 1
          fi
          echo "Using artifact: $TAR"
          tar -xzf artifacts/$TAR -C image_ctx
          if [ ! -f image_ctx/dayzctl ]; then
            echo "dayzctl binary not found inside archive" >&2
            ls -la image_ctx
            exit 1
          fi
          chmod +x image_ctx/dayzctl
          # Create a small Dockerfile that uses the binary from the artifact
          cat > image_ctx/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          ARG DAYZ_HOME=/srv/dayz
          ENV DAYZ_HOME=${DAYZ_HOME}
          RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates util-linux rsync && rm -rf /var/lib/apt/lists/*
          COPY dayzctl /usr/local/bin/dayzctl
          RUN chmod 755 /usr/local/bin/dayzctl
          RUN mkdir -p /etc/dayzctl && echo "# volume-mounted config" > /etc/dayzctl/config.yaml
          VOLUME ["/srv/dayz"]
          WORKDIR /srv/dayz
          ENTRYPOINT ["/usr/local/bin/dayzctl"]
          CMD ["--help"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./image_ctx
          file: ./image_ctx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/dayzctl:${{ github.ref_name || github.event.inputs.version }}
            ghcr.io/${{ github.repository_owner }}/dayzctl:latest
