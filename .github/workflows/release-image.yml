name: Build and push Docker image on release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Prepare build context and try download release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG=${{ github.event.release.tag_name }}
          VERSION=${TAG#v}
          ARCH=$(dpkg --print-architecture || echo amd64)
          ASSET="dayzctl_${VERSION}_linux_${ARCH}.tar.gz"
          mkdir -p build
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}"
          ASSET_URL=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "$API_URL" | jq -r '.assets[] | select(.name=="'"$ASSET"'") | .url') || true
          if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
            echo "Found asset: $ASSET"
            curl -L -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/octet-stream" -o build/${ASSET} "$ASSET_URL"
            tar -xzf build/${ASSET} -C build
          else
            echo "Asset $ASSET not found on release; Dockerfile will attempt to download binary during build"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/dayzctl:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/dayzctl:latest
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
