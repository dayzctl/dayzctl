version: 2

project_name: dayzctl

before:
  hooks:
    - go mod download
    - go mod tidy

builds:
  - id: dayzctl
    main: ./cmd/dayzctl
    binary: dayzctl
    env:
      - CGO_ENABLED=0
    # Released binaries stay self-contained: the map data is compiled in, so a
    # downloaded dayzctl has a working Map tab on its own. The .deb is the lean
    # variant — it ships an 11 MB binary built with `-tags nomaps` plus the map
    # files under /usr/share/dayzctl/maps, which the server reads from disk.
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/dayzctl/dayzctl/internal/version.Version={{.Version}}
      - -X github.com/dayzctl/dayzctl/internal/version.BuildTime={{.Date}}

archives:
  - id: binary
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # Map imagery for the log analyzer, shared by every platform. scripts/install.sh
  # downloads it as dayzctl-maps.tar.gz and unpacks it into
  # /usr/local/share/dayzctl/maps.
  - id: maps
    meta: true
    formats: [tar.gz]
    name_template: "dayzctl-maps"
    files:
      - src: web/log-analyzer/maps

release:
  github:
    owner: dayzctl
    name: dayzctl
  draft: false
  prerelease: auto
  mode: replace
  name_template: "{{.ProjectName}} {{.Version}}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^Merge'

dist: dist
