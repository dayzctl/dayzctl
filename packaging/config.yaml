## dayzctl configuration installed by the .deb
##
## Map imagery is installed to /usr/share/dayzctl/maps, one of the fixed
## locations dayzctl checks, so nothing needs to be configured for it.

steam:
  username: ""

paths:
  base: "/srv/dayz"
  install_dir: "/srv/dayz/server"

# One entry per DayZ server. `map` must be a directory name from
# /usr/share/dayzctl/maps (chernarusplus, livonia, sakhal, namalsk, deerisle,
# banov, nasdara); it defaults to
# the instance name.
instances:
  # - name: main
  #   port: 2302
  #   steam_query_port: 27016
  #   template: dayzOffline.chernarusplus
  #   hostname: "DayZ Server"
  #   max_players: 60
  #   enabled: true
  #   map: chernarusplus
  #   rcon:
  #     enabled: true
  #     port: 2306
  #     password: change-me

web:
  enabled: true
  address: 127.0.0.1
  port: 8081
  # Login switch: flip enabled to true to require signing in before the UI and
  # API answer. The password form checks server.password_admin; Steam SSO is
  # offered when steam.enabled is set and the SteamID64 is in steam.admins.
  auth:
    enabled: false
    steam:
      enabled: false
      # admins:
      #   "76561198000000000": "Alice"
